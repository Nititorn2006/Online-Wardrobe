appId: com.anonymous.onlinewardrobe
---
# ============================================================
# START
# ============================================================

- launchApp:
    clearState: true

# ============================================================
# HOME
# ============================================================

- assertVisible: "ONLINEWARDROBE"
- assertVisible: "Your online wardrobe, always ready for your next look."
- assertVisible: "Plan your next look"
- assertVisible: "Saved outfits"

- assertVisible: "Home"
- assertVisible: "Try"
- assertVisible: "Add"
- assertVisible: "Closet"
- assertVisible: "Settings"

# ============================================================
# CLOSET
# ============================================================

- tapOn: "Closet"

# เช็กว่า bottom navigation ยังอยู่
- assertVisible: "Home"
- assertVisible: "Closet"

# ============================================================
# SETTINGS
# ============================================================

- tapOn: "Settings"

- assertVisible: "Home"
- assertVisible: "Settings"

# ============================================================
# ADD
# ============================================================

- tapOn: "Add"

- assertVisible: "Add a piece"
- assertVisible: "Show us the piece"
- assertVisible: "Take photo"
- assertVisible: "Photo library"
- runFlow:
    file: flows/assert-visible-or-scroll.yaml
    env:
      TARGET_TEXT: "Make it easy to find later"
- runFlow:
    file: flows/assert-visible-or-scroll.yaml
    env:
      TARGET_TEXT: "Save to My Clothes"

- back

- assertVisible: "ONLINEWARDROBE"
- assertVisible: "Home"

# ============================================================
# TRY
# ============================================================

- tapOn: "Try"

- assertVisible: "Home"
- assertVisible: "Try"

# ============================================================
# NAVIGATION STRESS TEST
# ============================================================

- tapOn: "Home"
- tapOn: "Try"
- tapOn: "Closet"
- tapOn: "Settings"
- tapOn: "Home"

- assertVisible: "ONLINEWARDROBE"

# ============================================================
# LANGUAGE SWITCH — CONTINUE IN THE SAME APP SESSION
# ============================================================

- runFlow: flows/change-language.yaml

# ============================================================
# ADD CLOTHES CAMERA TEST
# ============================================================

# Open Add Clothes
- tapOn: "Add"

- assertVisible: "Add a piece"
- assertVisible: "Take photo"

# ============================================================
# TAKE PHOTO
# ============================================================

- tapOn:
    text: "^(Take photo|Take clothing photo)$"

# Allow camera permission if requested
- tapOn:
    text: "^(While using the app|Allow|Only this time)$"
    optional: true

# Capture photo
- tapOn:
    point: "50%,88%"

# Confirm captured photo if requested
- tapOn:
    text: "^(OK|Use photo|Use Photo|Done)$"
    optional: true

# ============================================================
# CROP PHOTO
# ============================================================

# Open crop editor if required
- tapOn:
    text: "^(Crop|CROP)$"
    optional: true

# Confirm cropped photo
- tapOn:
    text: "^(Done|DONE|Save|SAVE|✓)$"
    optional: true

# ============================================================
# VERIFY PHOTO
# ============================================================

- extendedWaitUntil:
    visible:
      text: "^(Remove|Remove selected photo)$"
    timeout: 15000

# ============================================================
# ENTER CLOTHING NAME
# ============================================================

- scrollUntilVisible:
    element:
      text: "Clothing name"
    direction: DOWN
    timeout: 10000

- tapOn: "Clothing name"

- inputText: "Test 01"

- hideKeyboard

# ============================================================
# SAVE CLOTHING
# ============================================================

- assertVisible:
    text: "^(Save to My Clothes|Save clothing item)$"
    enabled: true

- tapOn:
    text: "^(Save to My Clothes|Save clothing item)$"

# ============================================================
# VERIFY SAVED CLOTHING
# ============================================================

- extendedWaitUntil:
    visible: "ONLINEWARDROBE"
    timeout: 15000

- tapOn: "Closet"

- scrollUntilVisible:
    element:
      text: "Test 01"
    direction: DOWN
    timeout: 10000

- assertVisible: "Test 01"
# ============================================================
# DONE
# ============================================================
