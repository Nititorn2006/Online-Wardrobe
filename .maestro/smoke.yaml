appId: com.anonymous.onlinewardrobe
---
# ============================================================
# START
# ============================================================

- launchApp

# ============================================================
# HOME
# ============================================================

- assertVisible: "ONLINEWARDROBE"
- assertVisible: "Your online wardrobe, always ready for your next look."
- assertVisible: "Plan your next look"
- assertVisible: "Saved outfits"

- assertVisible: "Home"
- assertVisible: "Try"
- assertVisible: "Add"
- assertVisible: "Closet"
- assertVisible: "Settings"

# ============================================================
# CLOSET
# ============================================================

- tapOn: "Closet"

# เช็กว่า bottom navigation ยังอยู่
- assertVisible: "Home"
- assertVisible: "Closet"

# ============================================================
# SETTINGS
# ============================================================

- tapOn: "Settings"

- assertVisible: "Home"
- assertVisible: "Settings"

# ============================================================
# ADD
# ============================================================

- tapOn: "Add"

- assertVisible: "Add a piece"
- assertVisible: "Show us the piece"
- assertVisible: "Take photo"
- assertVisible: "Photo library"
- runFlow:
    file: flows/assert-visible-or-scroll.yaml
    env:
      TARGET_TEXT: "Make it easy to find later"
- runFlow:
    file: flows/assert-visible-or-scroll.yaml
    env:
      TARGET_TEXT: "Save to My Clothes"

- back

- assertVisible: "ONLINEWARDROBE"
- assertVisible: "Home"

# ============================================================
# TRY
# ============================================================

- tapOn: "Try"

- assertVisible: "Home"
- assertVisible: "Try"

# ============================================================
# NAVIGATION STRESS TEST
# ============================================================

- tapOn: "Home"
- tapOn: "Try"
- tapOn: "Closet"
- tapOn: "Settings"
- tapOn: "Home"

- assertVisible: "ONLINEWARDROBE"

# ============================================================
# LANGUAGE SWITCH — CONTINUE IN THE SAME APP SESSION
# ============================================================

- runFlow: flows/change-language.yaml

# รันเคสทั้งหมดต่อใน session เดิม (add-top เรียก delete-top ภายใน)
- tapOn: "Home"
- runFlow: flows/add-top.yaml
- runFlow: flows/favorite.yaml
- runFlow: flows/try-outfits.yaml
- runFlow: flows/plan-next-look.yaml

# ============================================================
# DONE
# ============================================================
